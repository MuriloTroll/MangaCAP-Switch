
name: Build MangaCAP Switch

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      
      - name: Instalar bibliotecas do Switch
        run: |
          echo "Verificando acesso ao repositorio devkitPro"
          curl -IL --max-time 20 https://pkg.devkitpro.org/dkp-libs.db
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --noconfirm --needed switch-sdl2 switch-sdl2_image switch-libzip switch-zlib

      - name: Verificar bibliotecas
        run: |
          test -f /opt/devkitpro/portlibs/switch/include/SDL2/SDL.h
          test -f /opt/devkitpro/portlibs/switch/include/zip.h

      - name: Compilar MangaCAP
        run: make -j2

      - name: Verificar NRO
        run: test -s MangaCAP.nro && ls -lh MangaCAP.nro

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: MangaCAP-Switch-v0.3.1-NRO
          path: MangaCAP.nro
          if-no-files-found: error
