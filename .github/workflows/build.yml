name: Build MangaCAP Switch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Verificar bibliotecas existentes
        run: |
          test -f /opt/devkitpro/portlibs/switch/include/SDL2/SDL.h
          test -f /opt/devkitpro/portlibs/switch/include/SDL2/SDL_image.h
          test -f /opt/devkitpro/portlibs/switch/include/zlib.h
      - name: Verificar EGL
        run: test -f /opt/devkitpro/portlibs/switch/lib/libEGL.a
      - name: Verificar bibliotecas graficas
        run: |
          for lib in EGL glapi drm_nouveau; do
            test -f "/opt/devkitpro/portlibs/switch/lib/lib${lib}.a" || { echo "Biblioteca ausente: lib${lib}.a"; exit 1; }
          done
          echo "libdrm.a nao sera exigida nesta tentativa"
      - name: Instalar biblioteca HTTPS para capas
        run: |
          CURL_H=/opt/devkitpro/portlibs/switch/include/curl/curl.h
          CURL_LIB=/opt/devkitpro/portlibs/switch/lib/libcurl.a
          MBEDTLS_LIB=/opt/devkitpro/portlibs/switch/lib/libmbedtls.a
          MBEDX509_LIB=/opt/devkitpro/portlibs/switch/lib/libmbedx509.a
          MBEDCRYPTO_LIB=/opt/devkitpro/portlibs/switch/lib/libmbedcrypto.a
          if test -f "$CURL_H" && test -f "$CURL_LIB" && test -f "$MBEDTLS_LIB" && test -f "$MBEDX509_LIB" && test -f "$MBEDCRYPTO_LIB"; then
            echo "Bibliotecas HTTPS ja presentes; ignorando instalacao."
          else
            echo "Bibliotecas HTTPS ausentes; tentando instalar via devkitPro."
            dkp-pacman -Sy --noconfirm switch-curl switch-mbedtls
          fi
          for file in "$CURL_H" "$CURL_LIB" "$MBEDTLS_LIB" "$MBEDX509_LIB" "$MBEDCRYPTO_LIB"; do
            test -f "$file" || { echo "Dependencia HTTPS ausente: $file"; exit 1; }
          done
      - name: Compilar MangaCAP
        run: make -j2
      - name: Verificar NRO
        run: test -s MangaCAP.nro && ls -lh MangaCAP.nro
      - name: Publicar NRO em Release de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.9-teste12-build-${{ github.run_number }}
          name: MangaCAP Switch v0.7.9 - Teste 12 - Capas e titulo no leitor (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body: |
            Compilacao de teste da v0.7.9. Ainda nao validada no Nintendo Switch.
            Esta versao testa rotacao de 90 graus apenas no MangaCAP.
            Biblioteca em grade nas duas orientacoes, com barra de rolagem lateral.
            Capas maiores e nome do arquivo no topo durante a leitura.
            Melhor deteccao de gesto de arrasto no modo horizontal.
            Rolagem por arrasto no touchscreen e HUD de rotacao ocultavel.
            Botoes Topo e Girar compactos, vinho, lado a lado, com icones PNG.
            Navegacao entre capitulos preservada.
          files: MangaCAP.nro
          fail_on_unmatched_files: true
